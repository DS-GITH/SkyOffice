services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: xpert
      POSTGRES_PASSWORD: xpert
      POSTGRES_DB: xpert_office
    ports:
      - '54330:5432'
    volumes:
      - xpert_office_db:/var/lib/postgresql/data

volumes:
  xpert_office_db:
